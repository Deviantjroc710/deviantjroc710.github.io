name: checks

# WHY THIS EXISTS. This repository is public and indexed. The rules in
# README.md ("no named people, no employer, no live findings") were previously
# enforced by remembering them, which is not enforcement. These two jobs are
# the version that can fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  disclosure:
    # Scans every hand-written page for things that must never be published.
    # NOTE: the specific names live in the LEAK_DENYLIST secret, not in this
    # file -- a public repo cannot ship a denylist without naming what it bans.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the pages
        run: |
          find . -name '*.html' -not -path './.git/*' | sort > /tmp/pages.txt
          echo "scanning $(wc -l < /tmp/pages.txt) files"
          cat /tmp/pages.txt

      - name: Control — the scan must actually be reading the files
        # A scan that reads nothing prints exactly what a clean scan prints.
        # This is the guard against a green result that means "I looked at
        # zero bytes". It is the first line on the site, applied here.
        run: |
          n=$(xargs cat < /tmp/pages.txt | grep -oaic 'Derek Mankowski' || true)
          echo "control matches: $n"
          if [ "$n" = "0" ]; then
            echo "::error::control pattern absent - the scan is not reading anything, so its result is meaningless"
            exit 1
          fi

      - name: Generic identifiers
        run: |
          fail=0
          check() {
            hits=$(xargs grep -aoiE "$1" < /tmp/pages.txt 2>/dev/null | sort -u || true)
            [ -n "$3" ] && hits=$(echo "$hits" | grep -viE "$3" || true)
            if [ -n "$hits" ]; then
              echo "::error::$2"; echo "$hits" | head -5; fail=1
            fi
          }
          # Live e-mail addresses. grep -E has no lookahead, so RFC 2606
          # reserved domains are subtracted afterwards rather than excluded
          # inside the pattern.
          check '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' \
                'an e-mail address reached a public page' \
                '@(example|test|invalid)\.'
          check '(gh[pousr]_[A-Za-z0-9]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16})' \
                'something shaped like a credential reached a public page' ''
          [ "$fail" = 0 ] && echo "generic scan clean"
          exit $fail

      - name: Denylist from secret
        # Set LEAK_DENYLIST in repo settings: one term per line (client names,
        # employer, domains, internal systems). Absent = this step is skipped
        # and says so, rather than passing quietly.
        env:
          DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "::warning::LEAK_DENYLIST is not set - specific names are NOT being checked"
            exit 0
          fi
          fail=0
          while IFS= read -r term; do
            [ -z "$term" ] && continue
            if xargs grep -aliF -- "$term" < /tmp/pages.txt 2>/dev/null | grep -q .; then
              echo "::error::a denylisted term appears in a published page"
              xargs grep -aliF -- "$term" < /tmp/pages.txt | sed 's/^/  /'
              fail=1
            fi
          done <<< "$DENYLIST"
          [ "$fail" = 0 ] && echo "denylist scan clean"
          exit $fail

  readme-freshness:
    # A page that changes without its README is how the rules above quietly
    # stop being true. This cannot check that a README is CORRECT, only that
    # somebody looked at it.
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the page and its README
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || git diff --name-only HEAD~1 HEAD)
          echo "changed:"; echo "$CHANGED" | sed 's/^/  /'

          fail=0
          for dir in migration guards scripted-review collab-sorter websites verification; do
            if echo "$CHANGED" | grep -q "^$dir/index.html$" \
               && ! echo "$CHANGED" | grep -q "^$dir/README.md$"; then
              echo "::error file=$dir/index.html::$dir/index.html changed but $dir/README.md did not - update the claims it records, in this commit"
              fail=1
            fi
          done
          if echo "$CHANGED" | grep -q '^index.html$' \
             && ! echo "$CHANGED" | grep -q '^README.md$'; then
            echo "::error file=index.html::index.html changed but README.md did not"
            fail=1
          fi
          # demo/ is generated by another repository's workflow and has no README
          # here by design - that workflow deletes the folder before copying.
          [ "$fail" = 0 ] && echo "every changed page had its README touched"
          exit $fail
